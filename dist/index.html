<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef2f5"><title>一键记事</title><meta name="description" content="轻触一下，记下此刻。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%237cb8d9'/%3E%3Cellipse cx='12' cy='9' rx='7' ry='4' fill='white' opacity='.8'/%3E%3C/svg%3E">
<style>
:root{font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#283847;background:#eef2f5;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #367aab;outline-offset:8px}button{touch-action:manipulation}main{min-height:100svh;position:relative;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 39%,#fff 0%,#f5f8fa 34%,#e8eef3 80%,#e1e9f0 100%)}header{position:absolute;top:42px;left:52px;display:flex;align-items:center;gap:11px;font-size:16px;font-weight:600;letter-spacing:2px}.mark{width:17px;height:17px;border:1px solid #6e8a9e;border-radius:50%;box-shadow:inset -3px -3px 5px #a7c6d8,inset 3px 3px 4px white}.stage{display:flex;flex-direction:column;align-items:center;transform:translateY(-4px);width:100%;padding:80px 24px 110px}.orb-wrap{position:relative;margin:12px 0 49px}.orb-wrap:after{content:"";position:absolute;z-index:0;left:17%;right:17%;height:23px;bottom:-43px;border-radius:50%;background:#759caf;filter:blur(17px);opacity:.28}.orb{display:grid;place-items:center;position:relative;z-index:1;width:236px;height:236px;padding:0;border-radius:50%;border:1px solid #fff9;background:radial-gradient(ellipse at 32% 19%,#ffffffed 0%,#ffffffe6 5%,#ffffff26 27%,transparent 48%),radial-gradient(ellipse at 66% 77%,#b1f6ffc7 0%,#89cfe877 22%,transparent 52%),radial-gradient(ellipse at 24% 67%,#8daed680 0%,transparent 44%),radial-gradient(circle at 46% 41%,#e2f4fa33 25%,#aecddd99 56%,#729bac 76%,#d9faff 86%,#fff 100%);box-shadow:inset 0 2px 4px #fff,inset 7px 1px 13px #fff9,inset -8px -10px 19px #558cac4d,inset 0 -3px 4px #edffff,0 14px 34px #7393aa26,0 2px 4px #698a9c19;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}.orb:before{content:"";position:absolute;top:11%;left:17%;width:56%;height:29%;border-radius:50%;background:linear-gradient(170deg,#fff 0%,#ffffff85 33%,#ffffff0a 90%);transform:rotate(-27deg);filter:blur(1px)}.orb:after{content:"";position:absolute;inset:7px;border-radius:50%;border:1px solid #ffffff4f;border-bottom:3px solid #e4ffffbd;border-right-color:#ffffff14}.orb:hover{transform:translateY(-5px) scale(1.025)}.orb:active{transform:translateY(5px) scale(.945);box-shadow:inset 0 3px 25px #568eac66,0 4px 12px #7393aa33}.plus{position:relative;width:32px;height:32px;filter:drop-shadow(0 1px 1px #fff)}.plus:before,.plus:after{content:"";position:absolute;background:#456779b3;border-radius:4px;left:50%;top:50%;transform:translate(-50%,-50%)}.plus:before{width:28px;height:2px}.plus:after{height:28px;width:2px}h1{font-weight:500;letter-spacing:5px;font-size:26px;margin:17px 0 13px}.hint{font-size:15px;letter-spacing:1px;color:#73818e;margin:0}.methods{display:flex;align-items:center;gap:13px;color:#718492;margin-top:25px;font-size:14px}.methods span{display:flex;gap:7px;align-items:center}.methods i{width:3px;height:3px;background:#a7b5bf;border-radius:50%}svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}footer{position:absolute;bottom:32px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:3px;color:#8796a2}.composer{width:min(480px,100%);margin:28px auto 0;padding:20px;background:#ffffffa8;border:1px solid #fff;border-radius:24px;box-shadow:0 14px 55px #5e7c8f13;backdrop-filter:blur(20px)}[hidden]{display:none!important}textarea{display:block;width:100%;resize:vertical;min-height:116px;max-height:240px;border:0;background:transparent;color:#283847;padding:8px;outline:none;font-size:17px;line-height:1.7}textarea:focus-visible{box-shadow:0 0 0 2px #87b1cd55;border-radius:8px}textarea::placeholder{color:#8c9ba5}.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}.actions button{border:0;border-radius:22px;padding:11px 17px;font-size:14px;display:flex;align-items:center;gap:7px;background:#e6eef3;color:#526f82}.actions .done{background:#304d61;color:#fff}.actions .done:disabled{opacity:.35;cursor:default}.actions .close{background:transparent;color:#7c8b97;padding:10px}.right{display:flex;gap:4px}.status{font-size:14px;color:#607d90;line-height:1.6;margin:12px 8px 0}.editing .stage{padding-top:95px;padding-bottom:80px}.editing .orb{width:126px;height:126px}.editing .orb-wrap{margin:0 0 22px}.editing .orb-wrap:after{bottom:-22px;height:13px}.editing h1{font-size:21px;margin:12px 0}.editing .methods{display:none}.recording .orb{animation:breathe 1.4s ease-in-out infinite}.recording .plus:before{width:12px;height:27px;border-radius:8px}.recording .plus:after{width:22px;height:32px;border:2px solid #456779aa;background:transparent;border-top:0;top:57%;border-radius:0 0 12px 12px}.recording #voice{color:#287898;background:#d9edf5}@keyframes breathe{50%{box-shadow:0 0 0 13px #b9dbe933,0 0 0 27px #bddfed19,inset 0 2px 12px white;transform:scale(1.035)}}@media(max-width:600px){header{top:max(27px,env(safe-area-inset-top));left:26px;font-size:15px}.orb{width:214px;height:214px}.stage{transform:translateY(-14px);padding-inline:24px}h1{font-size:24px}.hint{font-size:14px}.orb-wrap{margin-bottom:42px}footer{bottom:max(26px,env(safe-area-inset-bottom));font-size:12px}.composer{padding:15px;border-radius:22px}.editing .stage{transform:none;padding-top:98px}.editing .orb{width:112px;height:112px}.editing footer{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head>
<body><main id="app"><header><span class="mark" aria-hidden="true"></span>一键记事</header><section class="stage" aria-label="随手记录"><div class="orb-wrap"><button class="orb" id="orb" aria-label="开始记事" aria-expanded="false" aria-controls="composer"><span class="plus" aria-hidden="true"></span></button></div><h1 id="heading">记下这一刻</h1><p class="hint" id="hint">轻触一下，让想法留下来</p><div class="methods" aria-hidden="true"><span><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 9h1m3 0h1m3 0h1M7 12h1m3 0h1m3 0h1M8 16h8"/></svg>打字</span><i></i><span><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 11v1a6 6 0 0 0 12 0v-1M12 18v3m-3 0h6"/></svg>语音</span></div><section id="composer" class="composer" hidden aria-label="输入记录"><textarea id="note" aria-label="记录内容" placeholder="有什么想记下的？"></textarea><div class="actions"><button id="voice"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 11v1a6 6 0 0 0 12 0v-1M12 18v3m-3 0h6"/></svg><span id="voiceLabel">语音输入</span></button><div class="right"><button class="close" id="close" aria-label="收起输入">收起</button><button class="done" id="done" disabled>记好了</button></div></div><p id="status" class="status" role="status" hidden></p></section></section><footer>每一个念头，都值得被留下</footer></main><script src="app.js"></script></body></html>
